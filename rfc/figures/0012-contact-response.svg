<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual equal-and-opposite plate contact response</title>
  <desc id="desc">Two plate blocks share a boundary. Compressive normal forces point outward on the two blocks and are equal and opposite. Separate tangential shear arrows oppose relative slip. A yielded boundary zone accommodates additional shortening through deformation.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 z" fill="#1f6f9f"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 z" fill="#a43c27"/></marker>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475661"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#fff"/>
  <text x="38" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17212b">A shared contact transmits load and can localize deformation</text>
  <rect x="95" y="110" width="340" height="228" rx="9" fill="#dce8ef" stroke="#567789" stroke-width="3"/>
  <rect x="565" y="110" width="340" height="228" rx="9" fill="#e8e2d7" stroke="#8f8066" stroke-width="3"/>
  <text x="215" y="145" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263c49">Plate A</text>
  <text x="687" y="145" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#443e33">Plate B</text>
  <rect x="455" y="110" width="90" height="228" fill="#f1c9b7" stroke="#a96246" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="463" y="192" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6f3525" transform="rotate(-90 463 192)">shared boundary zone</text>

  <line x1="440" y1="220" x2="270" y2="220" stroke="#1f6f9f" stroke-width="7" marker-end="url(#blueArrow)"/>
  <line x1="560" y1="220" x2="730" y2="220" stroke="#1f6f9f" stroke-width="7" marker-end="url(#blueArrow)"/>
  <text x="163" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#185b82">normal compression</text>
  <text x="740" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#185b82">equal and opposite</text>
  <text x="370" y="255" font-family="Arial, sans-serif" font-size="14" fill="#185b82">can be nonzero at zero slip</text>

  <line x1="420" y1="285" x2="420" y2="325" stroke="#a43c27" stroke-width="5" marker-end="url(#redArrow)"/>
  <line x1="580" y1="325" x2="580" y2="285" stroke="#a43c27" stroke-width="5" marker-end="url(#redArrow)"/>
  <text x="381" y="365" font-family="Arial, sans-serif" font-size="15" fill="#82331f">tangential shear</text>
  <text x="575" y="365" font-family="Arial, sans-serif" font-size="14" fill="#82331f">separate law; may resist slip</text>

  <rect x="305" y="410" width="390" height="70" rx="8" fill="#fff8e6" stroke="#bb9144" stroke-width="2"/>
  <text x="330" y="438" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#624b1e">If contact reaches its capacity</text>
  <text x="330" y="461" font-family="Arial, sans-serif" font-size="15" fill="#473d27">excess relative motion is assigned to local deformation</text>
  <line x1="500" y1="340" x2="500" y2="402" stroke="#475661" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#grayArrow)"/>
  <text x="50" y="505" font-family="Arial, sans-serif" font-size="13" fill="#505b63">Schematic only; force magnitudes, geometry, and constitutive response depend on the process.</text>
</svg>
