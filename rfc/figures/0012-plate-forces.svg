<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
  <title id="title">How forces set a plate's motion in this model</title>
  <desc id="desc">A central plate interior moves together in the model. Gravity at a ridge can push it away from the ridge, a sinking slab can tug on it, and drag from the mantle below can resist or help its motion. At a contact, each plate pushes on the other with equal and opposite forces. Crust deforms mainly near active plate boundaries. The diagram is conceptual; the examples need not occur together.</desc>
  <defs>
  </defs>
  <rect width="1080" height="700" fill="#fff"/>
  <text x="38" y="46" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17212b">How forces set a plate's motion in this model</text>
  <text x="38" y="75" font-family="Arial, sans-serif" font-size="16" fill="#4a555c">Several processes push or pull on a plate. The model combines their effects to estimate how the plate moves.</text>

  <!-- Main plate and neighboring plate -->
  <path d="M255 183 C350 142 605 142 710 190 L716 402 C620 444 352 444 252 399 Z" fill="#e5edf1" stroke="#4c6878" stroke-width="4"/>
  <path d="M740 176 L1000 176 L1000 302 L744 302 Z" fill="#f0e9f2" stroke="#8a7393" stroke-width="3"/>
  <text x="835" y="203" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#493d50">Plate B</text>
  <text x="427" y="249" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#283d48">Plate A interior</text>
  <text x="370" y="275" font-family="Arial, sans-serif" font-size="16" fill="#344b57">treated as moving together in this model</text>

  <!-- Ridge and ridge push -->
  <path d="M240 190 L240 395" stroke="#2d7d57" stroke-width="8"/>
  <path d="M207 215 L254 204 L231 230 Z M207 269 L254 258 L231 284 Z M207 323 L254 312 L231 338 Z M207 377 L254 366 L231 392 Z" fill="#2d7d57"/>
  <line x1="283" y1="330" x2="390" y2="330" stroke="#2d7d57" stroke-width="7"/>
  <path d="M390 320 L410 330 L390 340 Z" fill="#2d7d57"/>
  <rect x="38" y="112" width="205" height="100" rx="8" fill="#f1f8f3" stroke="#8bb49b" stroke-width="2"/>
  <text x="54" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#236346">Ridge push</text>
  <text x="54" y="164" font-family="Arial, sans-serif" font-size="14" fill="#35463d">Gravity moves crust downhill</text>
  <text x="54" y="185" font-family="Arial, sans-serif" font-size="14" fill="#35463d">away from a high ridge.</text>
  <line x1="243" y1="198" x2="269" y2="311" stroke="#2d7d57" stroke-width="2"/>

  <!-- Contact force pair at a different possible boundary -->
  <rect x="712" y="310" width="33" height="95" fill="#f0c7b5" opacity="0.72"/>
  <line x1="713" y1="350" x2="660" y2="350" stroke="#805099" stroke-width="7"/>
  <line x1="745" y1="376" x2="798" y2="376" stroke="#805099" stroke-width="7"/>
  <text x="775" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#704485">Contact force</text>
  <text x="775" y="254" font-family="Arial, sans-serif" font-size="13" fill="#604c67">Each plate pushes on the other.</text>
  <text x="775" y="273" font-family="Arial, sans-serif" font-size="13" fill="#604c67">Forces are equal and opposite.</text>
  <path d="M660 340 L640 350 L660 360 Z" fill="#805099"/>
  <path d="M798 366 L818 376 L798 386 Z" fill="#805099"/>

  <!-- Slab pull on the attached plate -->
  <path d="M704 389 L770 465 L837 513" fill="none" stroke="#a95b31" stroke-width="12"/>
  <line x1="777" y1="466" x2="841" y2="512" stroke="#a95b31" stroke-width="7"/>
  <path d="M833 500 L856 523 L829 517 Z" fill="#a95b31"/>
  <rect x="824" y="423" width="225" height="67" rx="8" fill="#fff7f1" stroke="#c99578" stroke-width="2"/>
  <text x="841" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#874724">Slab pull</text>
  <text x="841" y="472" font-family="Arial, sans-serif" font-size="14" fill="#563a2a">A sinking slab tugs on its plate.</text>

  <!-- Plate motion and basal drag -->
  <line x1="424" y1="354" x2="573" y2="354" stroke="#243640" stroke-width="6"/>
  <path d="M573 345 L594 354 L573 363 Z" fill="#243640"/>
  <text x="426" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#243640">combined plate motion</text>
  <path d="M300 462 C397 440 594 440 680 462" fill="none" stroke="#c9dce5" stroke-width="28"/>
  <line x1="456" y1="457" x2="388" y2="457" stroke="#426f9d" stroke-width="6"/>
  <path d="M388 448 L368 457 L388 466 Z" fill="#426f9d"/>
  <text x="263" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#355f84">Drag from the mantle below</text>
  <text x="263" y="533" font-family="Arial, sans-serif" font-size="14" fill="#405564">It can resist plate motion or help drive it, depending on how the mantle is moving.</text>

  <!-- Boundary deformation callout -->
  <rect x="38" y="432" width="205" height="99" rx="8" fill="#fff8e6" stroke="#bb9144" stroke-width="2"/>
  <text x="56" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#624b1e">At active boundaries</text>
  <text x="56" y="484" font-family="Arial, sans-serif" font-size="14" fill="#473d27">Crust can shorten, stretch,</text>
  <text x="56" y="505" font-family="Arial, sans-serif" font-size="14" fill="#473d27">or slide past neighboring crust.</text>
  <line x1="243" y1="450" x2="258" y2="410" stroke="#bb9144" stroke-width="2"/>

  <rect x="38" y="572" width="1004" height="82" rx="8" fill="#f7f8f9" stroke="#d1d7db" stroke-width="2"/>
  <text x="59" y="603" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#303a40">In short</text>
  <text x="132" y="603" font-family="Arial, sans-serif" font-size="16" fill="#303a40">The model combines pushes, pulls, and drag to work out plate motion.</text>
  <text x="59" y="631" font-family="Arial, sans-serif" font-size="15" fill="#59636a">It then uses motion along each boundary to estimate where the crust deforms. Examples are schematic and need not occur together.</text>
</svg>
