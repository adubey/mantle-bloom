  <path d="M65 570 C174 568 245 567 323 571 C386 575 428 580 489 582 C532 583 556 564 603 554 C646 547 683 548 724 532 L780 514 C855 507 925 519 1014 530 L1135 536" fill="none" stroke="#f1a078" stroke-width="3" stroke-dasharray="8 8"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="103" y="176" fill="#dceaf3" font-size="20" font-weight="700">CONTINENT</text>
    <text x="826" y="176" fill="#dceaf3" font-size="20" font-weight="700">OCEAN BASIN</text>
