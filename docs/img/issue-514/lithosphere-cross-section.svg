<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual convergent-mountain crust and lithosphere cross section</title>
  <desc id="desc">A schematic section through a continent and ocean basin with a convergent mountain belt. The ground surface follows elevation, the Moho separates thickened crust from mantle lithosphere, and the lithosphere base separates the thickened mantle lid from the softer asthenosphere. Both Hc and Hm are larger beneath the mountain belt.</desc>
