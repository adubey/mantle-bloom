  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">
    <path d="M861 242 L861 277" stroke="#fff4d9" stroke-width="2"/><text x="812" y="230" fill="#fff4d9">Ground surface</text>
    <path d="M1006 359 L1006 388" stroke="#f4ca80" stroke-width="2"/><text x="966" y="355" fill="#f4ca80">Moho</text>
    <path d="M1040 503 L1040 529" stroke="#f1a078" stroke-width="2"/><text x="958" y="499" fill="#ffd2b7">Lithosphere base</text>
