<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A plate's sparse, plate-local surface cells</title>
  <desc id="desc">Conceptual oblique view of a curved plate patch tiled by a sparse quadrilateral mesh, with boundary cells highlighted and a neighboring plate across a seam. An inset shows one leaf split into four children by a local two-by-two refinement.</desc>
  <defs>
    <clipPath id="plateClip"><path d="M241 235 C287 164 394 151 465 177 C523 126 627 153 664 202 C754 201 802 267 778 323 C824 379 765 437 710 448 C663 510 558 500 505 469 C429 505 328 470 321 418 C250 403 207 333 241 287 Z"/></clipPath>
  </defs>
