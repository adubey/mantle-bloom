  <title id="title">Plate surface cells carrying elevation</title>
  <desc id="desc">Conceptual oblique view of the same curved plate lattice as the territory figure, now colored by elevation and raised into simplified terrain relief. Blue marks deep ocean, green lowlands, ochre uplands, and pale peaks.</desc>
