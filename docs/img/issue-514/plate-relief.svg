  <text x="908" y="310" fill="#d4e4ed" font-family="Inter,Arial,sans-serif" font-size="16">Elevation varies</text>
  <text x="908" y="333" fill="#9fb3c3" font-family="Inter,Arial,sans-serif" font-size="14">from cell to cell</text>
  <text x="88" y="84" fill="#f1f7fa" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Surface fields travel with the plate</text>
  <text x="88" y="112" fill="#b5c9d6" font-family="Inter,Arial,sans-serif" font-size="16">The lattice carries elevation and crustal columns in the same cells.</text>
