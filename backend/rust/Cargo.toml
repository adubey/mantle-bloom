[package]
name = "mantle_bloom_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "mantle_bloom_rust"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module", "generate-import-lib"] }
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
